[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openlocalai-workbench"
version = "0.2.0"
description = "Offline, auditable AI workbench for regulated organizations"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "OpenLocalAI Contributors"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
release = ["pyinstaller==6.22.2"]

[project.scripts]
openlocalai = "openlocalai.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openlocalai = ["web/*", "sample.md"]
