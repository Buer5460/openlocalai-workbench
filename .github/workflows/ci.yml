name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose -f compose.yaml -f compose.nvidia.yaml config --quiet
      - name: Build application image
        run: docker build --tag openlocalai-workbench:ci .
      - name: Start application without a model runtime
        run: docker run --detach --name openlocalai-ci --publish 127.0.0.1:18765:8765 openlocalai-workbench:ci
      - name: Verify health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18765/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs openlocalai-ci
          exit 1
      - name: Show container logs on failure
        if: failure()
        run: docker logs openlocalai-ci
